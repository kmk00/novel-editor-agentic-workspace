<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Komponenty translator/ i przepływ tłumaczenia EN→PL" width="1120" height="640" viewBox="0 0 1120 640">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h1   { font-size: 26px; font-weight: 700; fill: #1f2328; }
      .sub  { font-size: 14px; fill: #57606a; }
      .ct   { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .ci   { font-size: 12.5px; fill: #57606a; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; fill: #0969da; }
      .file { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; fill: #1f2328; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .step { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .slbl { font-size: 13.5px; font-weight: 600; fill: #1f2328; }
      .smono{ font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; fill: #57606a; }
    </style>
  </defs>

  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="40" y="50" class="t h1">Komponenty <tspan class="mono" font-size="24">translator/</tspan></text>
  <text x="40" y="74" class="t sub">Silnik tłumaczenia to osobny projekt git. Edytor łączy się z nim tylko formatem plików i narzędziem <tspan class="mono">fix_errors.py</tspan>.</text>

  <!-- 3 component cards -->
  <g>
    <rect x="40" y="100" width="330" height="210" rx="10" class="card"/>
    <rect x="40" y="100" width="330" height="6" rx="3" fill="#cf222e"/>
    <text x="60" y="134" class="t ct">ln-translator/  — silnik</text>
    <text x="60" y="160" class="t ci">Osobne repo git (ma własny remote).</text>
    <text x="60" y="184" class="t file">translator.py</text>
    <text x="60" y="202" class="t ci">CLI + silnik (translate/refine/retry/resume)</text>
    <text x="60" y="226" class="t file">gui.py</text>
    <text x="60" y="244" class="t ci">podgląd EN | PL na żywo (PySide6)</text>
    <text x="60" y="268" class="t file">prompt.yaml</text>
    <text x="60" y="286" class="t ci">backend, model, glossary, styl</text>
  </g>

  <g>
    <rect x="395" y="100" width="330" height="210" rx="10" class="card"/>
    <rect x="395" y="100" width="330" height="6" rx="3" fill="#8250df"/>
    <text x="415" y="134" class="t ct">transcript/  — Whisper</text>
    <text x="415" y="160" class="t ci">Osobne repo git. Audio/wideo → tekst.</text>
    <text x="415" y="184" class="t file">transkrypcja.py</text>
    <text x="415" y="202" class="t ci">mp3 wav m4a flac ogg mp4 webm aac</text>
    <text x="415" y="226" class="t ci">modele: tiny → large-v3 (dom. medium)</text>
    <text x="415" y="244" class="t ci">wyjście: txt / srt / vtt / all</text>
    <text x="415" y="268" class="t file">README.md · komendy.txt</text>
    <text x="415" y="286" class="t ci">opis + ściąga (dom. język: en — daj -l pl)</text>
  </g>

  <g>
    <rect x="750" y="100" width="330" height="210" rx="10" class="card"/>
    <rect x="750" y="100" width="330" height="6" rx="3" fill="#1a7f37"/>
    <text x="770" y="134" class="t ct">workspace/  — dane robocze</text>
    <text x="770" y="160" class="t ci">Katalog per książka (nie jest repo git).</text>
    <text x="770" y="184" class="t file">config.yaml</text>
    <text x="770" y="202" class="t ci">backend, model, chunk_size, prompt</text>
    <text x="770" y="226" class="t file">context.md · glossary.yaml · names.yaml</text>
    <text x="770" y="244" class="t ci">kontekst fabuły, słownik, nazwy własne</text>
    <text x="770" y="268" class="t file">chapters/ · output/</text>
    <text x="770" y="286" class="t ci">wejście rozbite na rozdziały + wyniki</text>
  </g>

  <!-- flow -->
  <text x="40" y="356" class="t ct">Przepływ tłumaczenia (EN → PL)</text>

  <rect x="40" y="376" width="150" height="58" rx="10" class="step"/>
  <text x="115" y="402" class="t slbl" text-anchor="middle">EN tekst</text>
  <text x="115" y="421" class="t smono" text-anchor="middle">&lt;stem&gt;-plain.txt</text>

  <rect x="220" y="376" width="180" height="58" rx="10" class="step"/>
  <text x="310" y="402" class="t slbl" text-anchor="middle">translate</text>
  <text x="310" y="421" class="t smono" text-anchor="middle">chunk_size · 1:1 linie</text>

  <rect x="430" y="376" width="190" height="58" rx="10" class="step"/>
  <text x="525" y="402" class="t slbl" text-anchor="middle">chunks/</text>
  <text x="525" y="421" class="t smono" text-anchor="middle">chunk_NNN + original/</text>

  <rect x="650" y="376" width="200" height="58" rx="10" class="step"/>
  <text x="750" y="402" class="t slbl" text-anchor="middle">PL tekst</text>
  <text x="750" y="421" class="t smono" text-anchor="middle">&lt;stem&gt;-pl.txt</text>

  <rect x="880" y="376" width="200" height="58" rx="10" fill="#eaf7ee" stroke="#2da44e" stroke-width="1.5"/>
  <text x="980" y="402" class="t slbl" text-anchor="middle">fix_errors.py verify</text>
  <text x="980" y="421" class="t smono" text-anchor="middle">→ OK</text>

  <g stroke="#57606a" stroke-width="2" marker-end="url(#ar)" fill="none">
    <path d="M190,405 L216,405"/>
    <path d="M400,405 L426,405"/>
    <path d="M620,405 L646,405"/>
    <path d="M850,405 L876,405"/>
  </g>

  <!-- repair loop -->
  <path d="M525,376 L525,344 L750,344 L750,372" stroke="#bf8700" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="638" y="338" class="t smono" fill="#9a6700" text-anchor="middle">refine · retry · resume (naprawa błędnych chunków)</text>

  <!-- notes -->
  <line x1="40" y1="474" x2="1080" y2="474" stroke="#d8dee4"/>
  <text x="40" y="502" class="t ci">Backendy: <tspan class="mono">ollama</tspan> (lokalnie) · <tspan class="mono">deepseek</tspan> · <tspan class="mono">opencode-go</tspan> — wybór w <tspan class="mono">prompt.yaml</tspan> lub <tspan class="mono">--backend</tspan>.</text>
  <text x="40" y="524" class="t ci">Format 1:1: wejście numerowane liniami, model musi oddać tę samą liczbę linii; inaczej ponowienie i rekurencyjny podział bloku.</text>
  <text x="40" y="546" class="t ci">Stitch wyrównuje PL linia-po-linii do EN, więc liczba niepustych linii wyjścia = liczbie niepustych linii wejścia.</text>
  <text x="40" y="576" class="t ci" fill="#cf222e">Bezpieczeństwo: <tspan class="mono">.env</tspan>, <tspan class="mono">prompt.yaml</tspan> i <tspan class="mono">workspace/*/config.yaml</tspan> mogą zawierać klucze API — trzymaj je poza gitem i rotuj, jeśli wyciekną.</text>
  <text x="40" y="606" class="t ci">Szczegóły: <tspan class="mono">translator/README.md</tspan> · <tspan class="mono">translator/ln-translator/README.md</tspan> · <tspan class="mono">translator/transcript/README.md</tspan> · <tspan class="mono">translator/transcript/komendy.txt</tspan></text>
</svg>
